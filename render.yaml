services:
  - type: web
    name: cipherspace-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: "info"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATIONS_DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAME_SITE
        value: "none"
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: TRUST_PROXY
        value: "true"
